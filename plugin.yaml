name: swarm-studio
version: 0.4.1
description: "A crew of agents builds a whole launch from one prompt, live on a canvas you can watch and steer: a multi-page website, a working web app with a database, a playable game (also as a Godot, Unity or Unreal project), a promo film and social posts. Builds go to Swarm Feed, where others remix them and every maker is credited."
author: Pukujan
kind: standalone
# Installed on first use, never at plugin install (README, "What it does on your machine"):
# - the image service: @napi-rs/image, pinned to exactly 1.16.0 (MIT, a prebuilt binary for this platform), and
#   thumbhash, pinned to exactly 0.1.1 (MIT), from engine/imagetools/package-lock.json (integrity recorded) into
#   $HERMES_HOME/swarm-studio/image-tools/ with
#   `npm ci --ignore-scripts`: nothing is compiled and no install script runs. SWARM_IMAGE_SERVICE=0 turns it off.
# - Godot 4, only when the person presses "Install Godot 4" in a game plan's chat (or types "install godot"), never
#   by itself (engine/godotinstall.mjs, docs/engines/godot.md): on macOS with Homebrew, `brew install --cask godot`
#   (Homebrew's version, into /Applications; run with no terminal, so a password is refused, never asked for);
#   otherwise the Godot editor pinned to exactly 4.7.2-stable (MIT) from
#   https://github.com/godotengine/godot/releases/download/4.7.2-stable/ (GitHub's release-asset host), its size and
#   SHA-512 checked against that release's published sums before it is opened, unpacked into
#   $HERMES_HOME/swarm-studio/godot/4.7.2/ and run once with --version (that route writes nothing outside the data
#   folder). No sudo and no password on either route.
# - The sprite cutter's Python packages are NOT installed by this plugin, and Setup says so: cutting a painted
#   sprite out of its key colour runs gamemaker/cut.py, which needs numpy, scipy and Pillow in the Python the Studio
#   runs. Setup › Game › Sprite cutter reads which Python has them, and gives the exact command for the person to run
#   in their own terminal (`<python> -m pip install numpy scipy Pillow`). Without them a sprite keeps its magenta or
#   green background and the game draws a box behind the character (found on the Pro, 2026-11-15).
# - Godot's Web export templates, by that same press and never by itself (engine/godotinstall.mjs `installTemplates`):
#   the same release's Godot_v4.7.2-stable_export_templates.tpz, 1.28 GB, its size and SHA-512 checked against the
#   release's published sums before it is opened; only the Web templates are kept (about 20 MB) and the archive is
#   removed. They are written where Godot looks for them for its version, which is OUTSIDE $HERMES_HOME:
#   ~/Library/Application Support/Godot/export_templates/4.7.2.stable/ on macOS,
#   ~/.local/share/godot/export_templates/4.7.2.stable/ on Linux, %APPDATA%\Godot\export_templates\4.7.2.stable\
#   on Windows. A folder that already holds them is left alone. Without them a Godot game cannot be exported to the
#   web, so the same press installs them; a failed templates download leaves the editor installed and says so.
# Hermes tools it calls (bridge.py, through ctx.dispatch_tool; no key of its own), only when the person asks:
# - web_search and web_extract, for the planner's research step (engine/research.mjs): only when the person's words
#   ask to look something up, they press Research, or they ask in a talk (the planner's web_research tool: cards to
#   look at, kept only when pressed); at most 3 searches and 4 pages each time, 60 s, public addresses
#   only (Hermes refuses private ones in web_extract; the studio checks each address too). What was taken is kept in
#   the project's References with its link, and shown before a build uses it.
# Fetched on first use (README, "What it does on your machine"):
# - the asset library's assetrizz catalog and pictures, from raw.githubusercontent.com/mojomast/assetrizz at one
#   pinned commit (engine/library.mjs RIZZ_SHA), into $HERMES_HOME/swarm-studio/assetrizz/. The swarm_studio tool's
#   library_import, library_pick and reference_add ask the person first (Hermes's approval gate).
# Writes outside $HERMES_HOME only where the person points it (README, "What it does on your machine"), among them a
# project's source into a folder of their home folder they name (☰ › GitHub › A folder on this computer): a git checkout
# gets the project's commits on a new branch of its own (a local git fetch; nothing pushed), a plain folder gets the
# files in a subfolder, and a file there it did not write is replaced only after they say yes. Never the home folder
# itself, $HERMES_HOME, the studio's data or this plugin's folder; never a file that looks like a key.
requires_hermes: ">=0.23"
provides_tools:
  - swarm_design
  - swarm_canvas
  - swarm_studio
provides_hooks:
  - pre_tool_call
optional_env:
  - name: SWARM_STUDIO_API_KEY
    description: "Optional: a key for an OpenAI-compatible chat endpoint, used only when Hermes cannot run the crew's model calls (set SWARM_STUDIO_BASE_URL to change the endpoint; default InferHub)"
    secret: true
  - name: ELEVENLABS_API_KEY
    description: "Optional: ElevenLabs key for the Film studio's music and sound effects (without it the studio writes its own score)"
    secret: true
  - name: CKFF_API_KEY
    description: "Optional: ckff image key, used for pictures when Hermes's image tool cannot paint"
    secret: true
  - name: CKFF_BASE_URL
    description: "Optional: ckff endpoint (default https://ckffai.com/v1)"
  - name: CKFF_MODEL
    description: "Optional: ckff image model"
  - name: FISH_API_KEY
    description: "Optional: Fish Audio key for game characters' voices (ElevenLabs works too, with ELEVENLABS_API_KEY)"
    secret: true
  - name: MESHY_API_KEY
    description: "Optional: Meshy key for 3D characters (the studio asks before spending credits)"
    secret: true
  - name: PEXELS_API_KEY
    description: "Optional: Pexels key for stand-in photos while pictures are painted"
    secret: true
  - name: PEXELS_OCTO_LEASE
    description: "Optional: an Octo vault lease that reaches Pexels without holding its key"
    secret: true
  - name: OCTO_SWARM_WS
    description: "Optional: Octo workspace key for public copies of stand-in photos"
    secret: true
  - name: OCTO_SWARM_WORKSPACE_ID
    description: "Optional: the Octo workspace those copies go to"
  - name: OCTO_BASE_URL
    description: "Optional: Octo address (default https://octodb.design-bakery.com)"
  - name: SUPABASE_URL
    description: "Optional: a Supabase project for generated apps' data (or connect Supabase through Hermes)"
  - name: SUPABASE_SERVICE_ROLE_KEY
    description: "Optional: that Supabase project's service role key"
    secret: true
  - name: STRIPE_SECRET_KEY
    description: "Optional: a Stripe test key (sk_test_ or rk_test_) for generated apps' checkout; live keys are refused"
    secret: true
  - name: RESEND_API_KEY
    description: "Optional: a Resend key for a generated app's email (sign-in links, receipts), handed only to an app whose locked plan chose Resend; without it, emails go to the app's Outbox"
    secret: true
  - name: VERCEL_TOKEN
    description: "Optional: Vercel token for Publish and app deploys"
    secret: true
  - name: CLOUDFLARE_API_TOKEN
    description: "Optional: Cloudflare token for Publish to Cloudflare Pages"
    secret: true
  - name: JEV_KEY
    description: "Optional: an OpenRouter key kept for the Game room's Autoplay. With it, Jev (OpenRouter Decisions) chooses the AI player's moves, and what is on the game's screen (scene, button labels, dialogue, the hero's health, enemy and object names, the page's text, and a game's own published state) is sent to OpenRouter; without it the moves are scripted and nothing is sent"
    secret: true
license: FSL-1.1-ALv2
# Bundled, nothing installed (built by scripts/vendor.mjs, version, licence and SHA-256 beside each):
#   web/vendor/xstate/xstate.mjs   XState 5.33.3 (MIT): the studio page's navigation
#   web/vendor/snapdom/snapdom.js  snapDOM 3.7.0 (MIT): a page photographs itself for the Overview
#   web/vendor/mermaid/mermaid.min.js  Mermaid 12.2.0 (MIT): the build wall's Map window, fetched from the plugin's own
#                                  server when a Map first shows
#   engine/vendor/procs/procs.mjs  execa 9.6.1 (MIT) and tree-kill 1.2.2 (MIT), with their 22 dependencies (MIT,
#                                  ISC, Apache-2.0; every one pinned in scripts/vendor/procs/package-lock.json):
#                                  the server starts its child processes with execa and stops each with all of
#                                  its children (tree-kill: taskkill /T on Windows, ps/pgrep elsewhere)
#   engine/vendor/net/net.mjs      ipaddr.js 2.5.0 (MIT, no dependencies; pinned in scripts/vendor/net/package-lock.json):
#                                  the range check on every address the site walk and link reads reach
# The app engine's web and picture tools (dyad's web_search, web_fetch, web_crawl, generate_image) reach only the
# studio's loopback gateway (engine/enginetools.mjs), which answers them through Hermes's web_search and
# web_extract, the guarded site walk and Hermes's image_generate: no key of their own, nothing else on the network.
